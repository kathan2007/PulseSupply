[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsesupply-analytics-service"
version = "1.0.0"
description = "PulseSupply Real-time Analytics & Background Report Engine"
authors = [{ name = "PulseSupply DevOps Team" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "redis>=5.0.4",
    "SQLAlchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "venv", ".venv"]

