services:
  # ===================================================
  # 1. Order & Auth Microservice (Node.js/Express + Prisma)
  # ===================================================
  - type: web
    name: pulsesupply-order-service
    runtime: node
    plan: free
    rootDir: services/order-service
    buildCommand: npm install && npx prisma generate && npx prisma db push && node src/prisma/seed.js && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulsesupply-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYTICS_SERVICE_URL
        fromService:
          type: web
          name: pulsesupply-analytics-service
          property: host

  # ===================================================
  # 2. Analytics & Reporting Engine (Python FastAPI)
  # ===================================================
  - type: web
    name: pulsesupply-analytics-service
    runtime: python
    plan: free
    rootDir: services/analytics-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulsesupply-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0

  # ===================================================
  # 3. Frontend Web Application (Next.js Static Site on Global CDN)
  # ===================================================
  - type: static
    name: pulsesupply-frontend
    plan: free
    rootDir: services/frontend
    buildCommand: npm install && npm run build
    publishPath: out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: pulsesupply-order-service
          property: host

databases:
  # ===================================================
  # PostgreSQL Database
  # ===================================================
  - name: pulsesupply-postgres
    plan: free
    databaseName: pulsesupply_db
    user: pulsegateway
