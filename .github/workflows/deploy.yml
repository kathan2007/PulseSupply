name: PulseSupply CI/CD Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  # ==========================================
  # Job 1: Lint & Security Audit
  # ==========================================
  lint-and-audit:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/order-service/package-lock.json

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/analytics-service/requirements.txt

      - name: Hadolint Dockerfile Linting
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/order-service/Dockerfile
          ignore: DL3018,DL3008,DL3003
        continue-on-error: true

      - name: Lint Order & Auth Service (ESLint)
        run: |
          cd services/order-service
          npm ci
          npx eslint src/ --ext .ts || true

      - name: Lint Analytics Service (Flake8)
        run: |
          cd services/analytics-service
          pip install flake8
          flake8 app/ --max-line-length=120 --ignore=E203,W503 || true

      - name: Trivy Vulnerability Security Scan (Docker Base Images)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'node:20-alpine'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  # ==========================================
  # Job 2: Unit and Integration Tests
  # ==========================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: pulsesupply_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js for Order Service Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Order Service Tests
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/pulsesupply_test_db?schema=public"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "test_jwt_secret_key_minimum_32_characters_for_unit_tests"
          PORT: 4001
        run: |
          cd services/order-service
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm test

      - name: Setup Python for Analytics Service Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Analytics Service Tests
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/pulsesupply_test_db"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          cd services/analytics-service
          pip install -r requirements.txt
          pytest

  # ==========================================
  # Job 3: Build & Push Multi-Arch Docker Images
  # ==========================================
  build-and-push:
    name: Multi-Arch Build & GHCR Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: order-service
            context: ./services/order-service
            image: pulsesupply-order-service
          - service: analytics-service
            context: ./services/analytics-service
            image: pulsesupply-analytics-service
          - service: frontend
            context: ./services/frontend
            image: pulsesupply-frontend
          - service: nginx-gateway
            context: ./nginx
            image: pulsesupply-nginx-gateway

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up QEMU (for Multi-Arch Builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Multi-Architecture Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 4: Zero-Downtime Deployment
  # ==========================================
  deploy:
    name: Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.DEPLOY_SSH_HOST != ''
    steps:
      - name: SSH Deploy to Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting zero-downtime deployment for PulseSupply..."
            cd /opt/pulsesupply || { echo "Directory not found"; exit 1; }
            
            # Authenticate to GHCR on host
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull newly published images
            echo "📥 Pulling latest containers..."
            docker compose pull
            
            # Perform rolling update
            echo "🔄 Applying rolling restart with orphaned container cleanup..."
            docker compose up -d --remove-orphans
            
            # Wait for healthchecks
            echo "⏳ Verifying services health status..."
            sleep 10
            docker compose ps
            
            # Health check gateway
            curl -f -k https://localhost/healthz || { echo "Gateway health check failed!"; exit 1; }
            echo "✅ PulseSupply successfully deployed with zero downtime!"

